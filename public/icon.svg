<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #1a5c2e; }
      .leaf { fill: #ffffff; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2d7a45; }
      .leaf { fill: #ffffff; }
    }
  </style>
  <rect class="bg" width="180" height="180" rx="37" />
  <g transform="translate(90, 90)">
    <!-- Caule central -->
    <line class="leaf" x1="0" y1="40" x2="0" y2="-20" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <!-- Folha esquerda -->
    <path class="leaf" d="M-4,-20 C-30,-50 -45,-25 -20,-8 C-10,-2 -4,-10 -4,-20Z" />
    <!-- Folha direita -->
    <path class="leaf" d="M4,-20 C30,-50 45,-25 20,-8 C10,-2 4,-10 4,-20Z" />
    <!-- Folha pequena esquerda -->
    <path class="leaf" d="M-3,5 C-22,-15 -30,-2 -15,8 C-8,12 -3,5 -3,5Z" />
    <!-- Folha pequena direita -->
    <path class="leaf" d="M3,5 C22,-15 30,-2 15,8 C8,12 3,5 3,5Z" />
    <!-- Base / raiz -->
    <path class="leaf" d="M0,40 C-8,50 -15,55 -20,60" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path class="leaf" d="M0,40 C8,50 15,55 20,60" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Letra S estilizada no centro -->
    <text x="0" y="3" text-anchor="middle" font-family="serif" font-size="28" font-weight="bold" fill="white" opacity="0.9">S</text>
  </g>
</svg>